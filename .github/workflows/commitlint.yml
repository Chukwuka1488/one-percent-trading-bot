# =============================================================================
# COMMITLINT - Validate PR Title
# =============================================================================
# PURPOSE: Validates that PR titles follow conventional commit format
# NOTE: PR body is NOT validated - it's documentation, not a commit message
#       The PR title becomes the squash commit message
# =============================================================================

name: Commitlint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  commitlint:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Validating PR title: $PR_TITLE"
          echo "$PR_TITLE" | npx commitlint
          echo "✓ PR title follows conventional commit format"
