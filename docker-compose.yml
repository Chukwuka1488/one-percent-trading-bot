# One Percent Trading Bot - Local Development Stack
#
# Services:
#   - n8n: Workflow orchestration (Perplexity → Gemini → Signals)
#   - postgres: Database for n8n + trading data
#   - freqtrade: Trading bot framework (dry-run mode)
#   - prometheus: Metrics collection
#   - grafana: Visualization dashboards
#   - loki: Log aggregation
#   - promtail: Log shipping
#
# Usage:
#   docker compose up -d              # Start all services
#   docker compose logs -f n8n        # View n8n logs
#   docker compose logs -f freqtrade  # View Freqtrade logs
#   docker compose down               # Stop all services
#
# UIs:
#   - n8n: http://localhost:5678
#   - Freqtrade: http://localhost:8080
#   - Grafana: http://localhost:3001
#   - Prometheus: http://localhost:9090

services:
  # ==========================================================================
  # PostgreSQL - Database for n8n and trading data
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: trading-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trading_local}
      POSTGRES_DB: ${POSTGRES_DB:-trading_bot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trading}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # n8n - Workflow Orchestration
  # ==========================================================================
  # Orchestrates: Perplexity (research) → Gemini (sentiment) → Signals
  n8n:
    image: n8nio/n8n:latest
    container_name: trading-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database connection
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-trading_bot}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-trading}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-trading_local}

      # n8n settings
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/

      # Timezone
      GENERIC_TIMEZONE: ${TIMEZONE:-America/New_York}
      TZ: ${TIMEZONE:-America/New_York}

      # Security (set in .env for production)
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-false}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-}

      # API Keys (local dev only - visible via docker inspect)
      # For production: use n8n's built-in credentials or Docker secrets
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - n8n_data:/home/node/.n8n
      # Mount project for CLI access (optional)
      - ./ai/tools:/home/node/tools:ro
    ports:
      - "5678:5678"

  # ==========================================================================
  # Freqtrade - Trading Bot Framework
  # ==========================================================================
  # Runs in dry-run mode by default (paper trading)
  # Docs: https://www.freqtrade.io/en/stable/docker_quickstart/
  freqtrade:
    image: freqtradeorg/freqtrade:stable
    container_name: trading-freqtrade
    restart: unless-stopped
    volumes:
      - ./freqtrade/user_data:/freqtrade/user_data
    ports:
      - "127.0.0.1:8080:8080"
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --config /freqtrade/user_data/config.json
      --strategy SampleStrategy

  # ==========================================================================
  # Prometheus - Metrics Collection
  # ==========================================================================
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: trading-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=15d'
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================================================
  # Grafana - Visualization Dashboards
  # ==========================================================================
  grafana:
    image: grafana/grafana:10.2.0
    container_name: trading-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_HTTP_PORT: 3000
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trading_local}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================================================
  # Loki - Log Aggregation
  # ==========================================================================
  loki:
    image: grafana/loki:2.9.2
    container_name: trading-loki
    restart: unless-stopped
    volumes:
      - ./monitoring/loki:/etc/loki:ro
      - ./monitoring/loki/rules:/loki/rules
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================================================
  # Promtail - Log Shipper
  # ==========================================================================
  promtail:
    image: grafana/promtail:2.9.2
    container_name: trading-promtail
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - ./monitoring/promtail:/etc/promtail:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
      - ./freqtrade/user_data/logs:/freqtrade/logs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail-config.yml

  # ==========================================================================
  # PostgreSQL Exporter - Database Metrics
  # ==========================================================================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: trading-postgres-exporter
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-trading}:${POSTGRES_PASSWORD:-trading_local}@postgres:5432/${POSTGRES_DB:-trading_bot}?sslmode=disable"
    ports:
      - "9187:9187"

  # ==========================================================================
  # cAdvisor - Container Metrics
  # ==========================================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: trading-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8082:8080"

# ==========================================================================
# Volumes - Persistent data storage
# ==========================================================================
# Data stored in .docker/ directory (gitignored)
volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/.docker/postgres
  n8n_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/.docker/n8n
  prometheus_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/.docker/prometheus
  grafana_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/.docker/grafana
  loki_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/.docker/loki
